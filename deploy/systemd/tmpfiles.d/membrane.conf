# /etc/tmpfiles.d/membrane.conf
# Ensure /run/membrane exists at boot with correct permissions.
# systemd-tmpfiles-setup.service runs before any primal services.
#
# Type  Path                     Mode  User  Group  Age
d       /run/membrane            0755  root  root   -
d       /run/membrane/sandbox    0755  root  root   -
d       /run/membrane/canary     0755  root  root   -
