[package]
name = "membrane-shadow"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sovereign shadow functions — typed Rust CLI for cellMembrane gate control"

[[bin]]
name = "membrane"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { version = "1", features = ["process", "fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"], optional = true }
webpki-roots = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
blake3 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cellmembrane-types = { path = "../cellmembrane-types", version = "0.1" }
sha2 = "0.11.0"
hmac = "0.13.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4"
hex = "0.4.3"
base64 = "0.22.1"

[dev-dependencies]

[features]
default = ["http", "cloudflare"]
http = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
cloudflare = ["http"]

[lints]
workspace = true
